{% extends 'base.html'%}

{% block content %}
<h1>Changer role</h1>
<p>{{ utilisateur.username }}</p>

<form method="POST">
    {%  csrf_token %}
    <select name="role">
        <option value="citoyens">Citoyens</option>
        <option value="autorités">Autorité</option>
        <option value="ong">ONG</option>
        <option value="admin">Administrateur</option>
    </select>

    <button type="submit">
        Enregistrer
    </button>
{% endblock%}
