{% extends 'base.html' %}

{% block content %}

<h2>Mes notifications</h2>

{% if notifications %}

    {% for notification in notifications %}
        <div>
            <p>{{ notification.message }}</p>

            <small>{{ notification.date_creation }}</small>
        </div>
    {% endfor %}
    {% else %}
        <p>Aucune notification</p>
{% endif %}
{% endblock%}
