{% extends 'base.html'%}

{% block content %}
<div class="card" style="max-width: 760px; margin: 0 auto;">
    <h1 style="font-weight: 700; color: var(--green-900); margin-bottom: 20px;">Modifier un signalements </h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}
        {% for field in form %}
               <div style="display:flex; flex-direction:column; gap:6px;">
                <label for="{{ field.id_for_label }}" style="font-weight:700; color:var(--green-900);">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small style="color:var(--muted);">{{ field.help_text }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <hr>
        <br>
        <button type="submit">
           💾 Enregistrer
        </button>
        <hr>
        <br>
        <a href="{% url 'detail_signalements' signalements.pk %}" class="btn btn-secondary">📰 Retour au détail du signalements</a>

    </form>
</div>

{% endblock %}
