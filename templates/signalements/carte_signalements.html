{% extends 'base.html' %}

{% block content %}
<div class="card">
    <span class="pill">🗺️ Carte des signalements</span>
    <h3>Visualisation géographique des incidents environnementaux</h3>
    <p>Filtrez les signalements par statut pour mieux suivre les actions de terrain.</p>

    <form method="get" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 16px 0;">
        <label><strong>Filtrer par état :</strong></label>
        <select name="etat" style="padding:8px 10px; border-radius:8px; border:1px solid #dfe9e2;">
            <option value="">Tous</option>
            <option value="en_attente" {% if request.GET.etat == "en_attente" %}selected{% endif %}>En attente</option>
            <option value="en_cours" {% if request.GET.etat == "en_cours" %}selected{% endif %}>En cours</option>
            <option value="resolu" {% if request.GET.etat == "resolu" %}selected{% endif %}>Résolu</option>
            <option value="rejete" {% if request.GET.etat == "rejete" %}selected{% endif %}>Rejeté</option>
        </select>
        <button type="submit" class="btn">Filtrer</button>
        <a href="{% url 'carte_signalements' %}" class="btn secondary">Réinitialiser</a>
    </form>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #dfe9e2;
        }
        .leaflet-popup-content img {
            max-width: 200px;
            border-radius: 8px;
            margin: 5px 0;
        }
    </style>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
    var map = L.map('map').setView([-4.325, 15.322], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    {% for signalement in signalements %}
        {% if signalement.latitude and signalement.longitude %}
            var iconColor = "#1f7a5b";
            {% if signalement.statut == "en_attente" %}
                iconColor = "#f59e0b";
            {% elif signalement.statut == "en_cours" %}
                iconColor = "#2563eb";
            {% elif signalement.statut == "resolu" %}
                iconColor = "#16a34a";
            {% elif signalement.statut == "rejete" %}
                iconColor = "#dc2626";
            {% endif %}

            L.circleMarker([
                {{ signalement.latitude }},
                {{ signalement.longitude }}
            ], {
                radius: 8,
                color: iconColor,
                fillColor: iconColor,
                fillOpacity: 0.85,
                weight: 2
            })
            .addTo(map)
            .bindPopup(`
                <h3>{{ signalement.titre|escapejs }}</h3>
                <p><strong>État :</strong> {{ signalement.get_statut_display }}</p>
                <p>{{ signalement.description|escapejs }}</p>
                {% if signalement.photo %}
                    <img src="{{ signalement.photo.url }}">
                {% endif %}
                <br>
                <a href="{% url 'detail_signalements' signalement.pk %}">Voir les détails</a>
            `);
        {% endif %}
    {% endfor %}
</script>
{% endblock %}
