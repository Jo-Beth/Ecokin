{% extends 'base.html' %}

{% block content %}
<h1>Traiter le signalement</h1>

<p> {{ signalement.titre }}</p>
<form method="POST" style="display:grid; gap: 12px; margin-top: 16px;">
    {%  csrf_token %}

    <select name="statut" style="
        width: 100%; 
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        background-color: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(0,0,0, 0.05);
        transition: border-color 0.2s, box-shadow 0.2s;
    ">
        <option value="en_attente">
           ⌛ En attente
        </option>
            
        <option value="en_cours">
          🔄  En cours
        </option>

        <option value="resolu">
           ✅ Résolus
        </option>

        <option value="rejete">
          🚫  Réjété
        </option>

    </select>

     <button type="submit" class="btn">
        Mettre à jour
    </button>
    <a href="{% url 'aller_a_mon_espace' %}"class="btn " >📊 Retourner a mon espace</a>
</form>






{% endblock %}
